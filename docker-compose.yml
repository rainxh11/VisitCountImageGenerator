volumes:
  visit_count_db:

services:
  visit-count-generator:
    container_name: visit-count-generator
    hostname: visit-count
    image: rainxh11/visit-count-image-generator
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      BIND_ADDRESS: "0.0.0.0:8000"
      DATABASE_PATH: "/data/visits.sqlite3"
    volumes:
      - visit_count_db:/data
